# The domain server + a Cloudflare quick tunnel so the hosted runtime can reach it.
#
#   cp env.example .env             # set EVAL_DOMAIN_SHARED_SECRET, WAXELL_API_URL, WAXELL_TENANT_ID
#   docker compose up -d
#   ./scripts/tunnel_url.sh         # prints https://<random>.trycloudflare.com/api → EVAL_DOMAIN_BASE_URL
#
# Quick tunnels need no Cloudflare account and present a valid TLS certificate.
# The hostname changes every time the tunnel container restarts: re-run
# tunnel_url.sh and push_domains.sh after a restart.
services:
  domain_server:
    build: ./domain_server
    env_file: .env
    environment:
      EVAL_DB_PATH: /data/eval.sqlite
    volumes:
      - eval_data:/data
    ports:
      - "8030:8030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8030/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://domain_server:8030
    depends_on:
      domain_server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  eval_data:
